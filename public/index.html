<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoteX</title>
  <link rel="icon" type="image/png" href="/static/imagenes/icon-192.png">
  <link rel="apple-touch-icon" href="/static/imagenes/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#38bdf8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NoteX">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════
       PANTALLA 1 — LISTA DE NOTAS
  ═══════════════════════════════════════════ -->
  <div id="pantallaLista" class="pantalla activa">

    <!-- Header -->
    <header class="header-lista">
      <div class="header-izq">
        <img src="/static/imagenes/icon-192.png" class="logo-mini" alt="NoteX">
        <h1>Mis notas</h1>
      </div>
      <div class="header-der">
        <button id="btnTema" class="btn-icono" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>
        <button id="btnSalir" class="btn-icono btn-salir" title="Cerrar sesión" aria-label="Cerrar sesión">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <!-- Barra de búsqueda + orden -->
    <div class="barra-filtros">
      <div class="campo-busqueda">
        <svg class="icono-buscar" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="inputBuscar" type="search" placeholder="Buscar notas…" autocomplete="off">
      </div>
      <select id="selOrden" title="Ordenar notas" aria-label="Ordenar notas">
        <option value="recientes">Recientes</option>
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
        <option value="manual">Manual</option>
      </select>
    </div>

    <!-- Contador -->
    <div id="contadorNotas" class="contador-notas"></div>

    <!-- Grid de notas -->
    <div id="gridNotas" class="grid-notas"></div>

    <!-- Estado vacío -->
    <div id="estadoVacio" class="estado-vacio oculto">
      <div class="vacio-icono">📝</div>
      <p class="vacio-titulo">No tenés notas todavía</p>
      <p class="vacio-subtitulo">Empezá creando tu primera nota</p>
      <button id="btnCrearPrimera" class="btn-primero">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Creá tu primera nota
      </button>
    </div>

    <!-- Botón flotante (+) -->
    <button id="btnNueva" class="fab" title="Nueva nota" aria-label="Nueva nota">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

  </div>


  <!-- ═══════════════════════════════════════════
       PANTALLA 2 — EDITOR DE NOTA
  ═══════════════════════════════════════════ -->
  <div id="pantallaEditor" class="pantalla">

    <!-- Header del editor -->
    <header class="header-editor">
      <button id="btnVolver" class="btn-volver" title="Volver a notas" aria-label="Volver">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Notas
      </button>
      <span id="estadoGuardado" class="estado-guardado"></span>
      <button id="btnBorrar" class="btn-borrar" title="Borrar nota" aria-label="Borrar nota">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      </button>
    </header>

    <!-- Título -->
    <input id="titulo" type="text" placeholder="Título de la nota" autocomplete="off" spellcheck="true">

    <!-- Barra de formato -->
    <div class="herramientas" id="herramientas">
      <button data-cmd="bold" title="Negrita (Ctrl+B)"><b>B</b></button>
      <button data-cmd="italic" title="Cursiva (Ctrl+I)"><i>I</i></button>
      <button data-cmd="underline" title="Subrayado (Ctrl+U)"><u>U</u></button>
      <button data-cmd="strikeThrough" title="Tachado"><s>S</s></button>
      <span class="separador"></span>
      <button data-cmd="insertUnorderedList" title="Lista">• Lista</button>
      <button data-cmd="insertOrderedList" title="Lista numerada">1. Lista</button>
      <span class="separador"></span>
      <select id="selFuente" title="Fuente" aria-label="Fuente">
        <option value="">Fuente</option>
        <option value="Arial">Arial</option>
        <option value="Georgia">Georgia</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Courier New">Courier New</option>
        <option value="Verdana">Verdana</option>
      </select>
      <select id="selTamano" title="Tamaño" aria-label="Tamaño">
        <option value="">Tamaño</option>
        <option value="2">Pequeño</option>
        <option value="3">Normal</option>
        <option value="5">Grande</option>
        <option value="6">Muy grande</option>
      </select>
      <label class="color" title="Color de letra">A
        <input type="color" id="selColor" value="#e11d48">
      </label>
      <button id="btnLimpiar" title="Quitar formato">✕ Formato</button>
      <span class="separador"></span>
      <button id="btnTarea" title="Insertar tarea">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><circle cx="12" cy="12" r="10"/></svg>Tarea
      </button>
    </div>

    <!-- Área de escritura -->
    <div id="contenido" contenteditable="true" data-placeholder="Escribí tu nota…" spellcheck="true"></div>

  </div>

  <script src="/static/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
